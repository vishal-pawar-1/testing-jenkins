apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: nginx-ns

spec:
  replicas: 3

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend
          image: vishalpawar2672/nginxweb:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 80