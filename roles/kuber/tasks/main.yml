- name: create kind cluster
  command: kind create cluster --config=./kubernetes/kind-config.yaml

- name: apply namespace
  command: kubectl apply -f kubernetes/namespace.yml

- name: apply deployment
  command: kubectl apply -f kubernetes/deployment.yml

- name: apply service
  command: kubectl apply -f kubernetes/service.yml

- name: install grafana
  command: kubectl apply -f kubernetes/grafana-install.yml